<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원가입 등록 기능 만들어보기를 변형해 보자!</title>
<style>
	table {
		border: solid black; 
		border-collapse:collapse; 
		width:500px;
	}
	td {
		border: 1px solid black; 
		margin-left:1; 
		padding:5px;
	}
	.btn_group{
		text-align:center;
	}
</style>
<script>
	function send() {
		if(!frm.name.value){
			alert("이름을 입력하세요.")
			frm.name.focus();
			return;
		}
		// 라디오 검사
		if(!frm.gender[0].checked && !frm.gender[1].checked){
			alert("성별을 선택하세요");
			
			return;
		}
		// 체크박스 검사(적으면 위처럼 하면 된다) 체크박스가 많을때 사용법
		var flag = false;
		for(i = 0; i < frm.hobby.length; i++) {
			if(frm.hobby[i].checked){
				flag =true;
				break;
			}
		}
		if(!flag){
			alert("경고");
			// 경고 별도로 만들어주기
		}
		
		//select
		if(frm.job.selectedIndex == 0) {
			alert("직업을 선택하세요");
			return
		}
		frm.submit();
		
	}
	function dl() {
		alert("등록된 정보를 모두 지우고 다시 입력합니다");
		frm.reset();
		document.frm.name.focus();
	}
</script>
</head>
<body>
<form name="frm" id="" method="post" action="member_08_ok.jsp">
	<table>
		<tr>
			<td colspan=2 align="center">회원가입 폼</td>
		</tr>
		<tr>
			<td width="100">이름</td>
			<td><input type="text" name="name" id="name" value="AAAA"></td>
		</tr>
		<tr>
			<td>성별</td>
			<td>
				<input type="radio" name="gender" value="M" checked>남성
				<input type="radio" name="gender" value="F">여성
			</td>
		</tr>
		<tr>
			<td>취미</td>
			<td>
				<input type="checkbox" name="hobby" value="여행" checked>여행
				<input type="checkbox" name="hobby" value="영화">영화
				<input type="checkbox" name="hobby" value="등산">등산
				<input type="checkbox" name="hobby" value="운동">운동
				<input type="checkbox" name="hobby" value="러닝">러닝
			</td>
		</tr>
		<tr>
			<td>직업</td>
			<td>
				<select name="job">
					<option>직업을 선택하세요</option>
					<option value="공무원">공무원</option>
					<option value="군인" selected>군인</option>
					<option value="학생">학생</option>
					<option value="선생">선생</option>
					<option value="기타">기타</option>
				</select>
			</td>
		</tr>
		<tr>
			<td>소개</td>
			<td>
				<textarea name="intro" cols=30 rows=4></textarea>
			</td>
		</tr>
		<tr>
			<td colspan=2 class=btn_group>
				<input type="button" name="agree" value="등록" onClick="send()">
				<input type="button" name="cancel" value="취소" onClick="dl()">
			</td>
		</tr>
</table>
</form>
</body>
</html>
