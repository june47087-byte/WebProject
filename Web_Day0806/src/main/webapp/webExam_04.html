<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>tr th td 알아보기</title>
<style>
	table {border:groove black; border-collapse:collapse;}
	td {border:1px solid black; margin-left:0; padding:5px;}
	th {border:1px solid black; margin-left:0; padding:5px; width:120px;}
</style>
</head>
<body>
	<table summary="4인실과 2인실이 있으며 1인당 2만원입니다">
	<caption>요안도라 객실</caption>
		<tr>
			<th>방 이름</th> 
			<th>대상</th>
			<th>크기</th> 
			<th>가격</th> 
		</tr>
		<tr>
			<th>유채방</th>
			<td>여성 도미토리</td> 
			<td rowspan="3">4인실</td> 
			<td rowspan="4">1인 20,000원</td> 
		</tr>
		<tr>
			<th rowspan="2">동백방</th> 
			<td>동성 도미토리</td>
		</tr> 
		<tr>
			<td>가족 1팀</td>
		</tr> 
		<tr>
			<th>천혜향방</th> 
			<td>-</td>
			<td>2인실</td>
		</tr> 
	</table> 
</body>
</html>
